server {
    listen       8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Gzip compression untuk memperkecil ukuran response
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # Cache-control untuk static assets Vite (hash-based filenames)
    location ~* \.(?:js|css|woff2?|ttf|otf|eot|ico|svg|webp|avif|png|jpg|jpeg|gif|mp3|webm|mp4)$ {
        expires     1y;
        add_header  Cache-Control "public, immutable";
        access_log  off;
    }

    # SPA fallback — semua route diteruskan ke index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Sembunyikan informasi versi Nginx
    server_tokens off;

    # Keamanan dasar — header HTTP
    add_header X-Frame-Options        "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"      always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
}
