server {
    listen       8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Gzip compression untuk memperkecil ukuran response
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # Matikan cache sementara agar setiap deployment langsung terupdate di browser pengguna
    location ~* \.(?:js|css|woff2?|ttf|otf|eot|ico|svg|webp|avif|png|jpg|jpeg|gif|mp3|webm|mp4)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires -1;
        access_log off;
    }

    # SPA fallback — SELALU NO-CACHE untuk index.html agar bundle terbaru selalu dibaca
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires -1;
    }

    # Sembunyikan informasi versi Nginx
    server_tokens off;

    # Keamanan dasar — header HTTP
    add_header X-Frame-Options        "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"      always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
}
